openapi: 3.0.3
info:
  title: Teologist API
  description: API para gerenciar o conteúdo do projeto Teologist, incluindo autores, blogs, posts e comentários.
  version: 1.0.0

servers:
  - url: http://localhost/api
    description: Servidor de Desenvolvimento Local

# Define o esquema de segurança (autenticação)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Autenticação via token Sanctum. Inclua 'Bearer ' antes do token."

  schemas:
    # ------------- SCHEMAS DE DADOS -------------
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Test User"
        email:
          type: string
          format: email
          example: "test@example.com"
        birth_date:
          type: string
          format: date
          example: "1990-01-01"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Author:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Santo Agostinho"
        email:
          type: string
          format: email
          example: "agostinho@example.com"
        site:
          type: string
          nullable: true
          example: "https://site.com"
        instagram:
          type: string
          nullable: true
          example: "@santoagostinho"
        phone:
          type: string
          nullable: true
        about:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
          example: "Bispo de Hipona"

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Patrística"
        slug:
          type: string
          example: "patristica"
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          example: "#FF0000"

    BlogContent:
      type: object
      properties:
        content:
          type: string
          example: "Este é o conteúdo principal do blog..."
        order:
          type: integer
          example: 1

    Blog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Confissões"
        subtitle:
          type: string
          example: "Uma jornada da alma"
        about:
          type: string
          example: "Uma breve descrição do livro."
        thumbnail:
          type: string
          format: url
          example: "https://example.com/thumb.jpg"
        author:
          $ref: '#/components/schemas/Author'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        contents:
          type: array
          items:
            $ref: '#/components/schemas/BlogContent'

    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Meu primeiro post"
        content:
          type: string
          example: "Conteúdo do post."
        likes:
          type: integer
          example: 42
        user:
          $ref: '#/components/schemas/User'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    Comment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        content:
          type: string
          example: "Ótimo post!"
        likes:
          type: integer
          example: 10
        user:
          $ref: '#/components/schemas/User'
        post_id:
          type: integer
          example: 1

    # ------------- SCHEMAS DE REQUEST BODY -------------
    UpsertAuthor:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        site:
          type: string
        instagram:
          type: string
        phone:
          type string
        about:
          type: string
        title:
          type: string
      required:
        - name
        - email

    UpsertCategory:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        color:
          type: string
      required:
        - name
        - slug

    UpsertBlog:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        about:
          type: string
        thumbnail:
          type: string
          format: url
        author_id:
          type: integer
        contents:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              order:
                type: integer
        categories:
          type: array
          items:
            type: integer
          description: "Array de IDs de categorias"
      required:
        - title
        - subtitle
        - about
        - thumbnail
        - author_id
        - contents

    UpsertPost:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
      required:
        - title
        - content

    UpsertComment:
      type: object
      properties:
        content:
          type: string
        post_id:
          type: integer
          description: "Necessário apenas ao criar (POST)."
      required:
        - content

    # ------------- SCHEMAS DE RESPOSTA -------------
    ErrorValidation:
      type: object
      properties:
        message:
          type: string
          example: "The given data was invalid."
        errors:
          type: object
          example: {"field_name": ["The field_name field is required."]}

# Define a segurança padrão para todos os endpoints que a necessitarem
security:
  - bearerAuth: []

paths:
  # ------------- AUTHORS -------------
  /authors:
    get:
      tags: [Authors]
      summary: Lista todos os autores
      security: [] # Rota pública
      responses:
        '200':
          description: OK
    post:
      tags: [Authors]
      summary: Cria um novo autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAuthor'
      responses:
        '201':
          description: Criado com sucesso
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidation'
        '401':
          description: Não autenticado

  /authors/{author}:
    get:
      tags: [Authors]
      summary: Obtém um autor específico
      security: [] # Rota pública
      parameters:
        - name: author
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '404':
          description: Não encontrado
    put:
      tags: [Authors]
      summary: Atualiza um autor
      parameters:
        - name: author
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAuthor'
      responses:
        '200':
          description: Atualizado com sucesso
        '401':
          description: Não autenticado
    delete:
      tags: [Authors]
      summary: Deleta um autor
      parameters:
        - name: author
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removido com sucesso
        '401':
          description: Não autenticado

  # ------------- CATEGORIES -------------
  /categories:
    get:
      tags: [Categories]
      summary: Lista todas as categorias
      security: []
      responses:
        '200':
          description: OK
    post:
      tags: [Categories]
      summary: Cria uma nova categoria
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCategory'
      responses:
        '201': {description: Criado}
        '401': {description: Não autenticado}

  /categories/{category}:
    get:
      tags: [Categories]
      summary: Obtém uma categoria específica
      security: []
      parameters:
        - name: category
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: OK}
    put:
      tags: [Categories]
      summary: Atualiza uma categoria
      parameters:
        - name: category
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCategory'
      responses:
        '200': {description: Atualizado}
        '401': {description: Não autenticado}
    delete:
      tags: [Categories]
      summary: Deleta uma categoria
      parameters:
        - name: category
          in: path
          required: true
          schema: {type: integer}
      responses:
        '204': {description: Removido}
        '401': {description: Não autenticado}

  # ------------- BLOGS -------------
  /blogs:
    get:
      tags: [Blogs]
      summary: Lista todos os blogs
      security: []
      responses:
        '200': {description: OK}
    post:
      tags: [Blogs]
      summary: Cria um novo blog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBlog'
      responses:
        '201': {description: Criado}
        '401': {description: Não autenticado}

  /blogs/{blog}:
    get:
      tags: [Blogs]
      summary: Obtém um blog específico
      security: []
      parameters:
        - name: blog
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: OK}
    put:
      tags: [Blogs]
      summary: Atualiza um blog
      parameters:
        - name: blog
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBlog'
      responses:
        '200': {description: Atualizado}
        '401': {description: Não autenticado}
    delete:
      tags: [Blogs]
      summary: Deleta um blog
      parameters:
        - name: blog
          in: path
          required: true
          schema: {type: integer}
      responses:
        '204': {description: Removido}
        '401': {description: Não autenticado}

  # ------------- POSTS -------------
  /posts:
    get:
      tags: [Posts]
      summary: Lista todos os posts
      security: []
      responses:
        '200': {description: OK}
    post:
      tags: [Posts]
      summary: Cria um novo post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPost'
      responses:
        '201': {description: Criado}
        '401': {description: Não autenticado}

  /posts/{post}:
    get:
      tags: [Posts]
      summary: Obtém um post específico
      security: []
      parameters:
        - name: post
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: OK}
    put:
      tags: [Posts]
      summary: Atualiza um post
      parameters:
        - name: post
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPost'
      responses:
        '200': {description: Atualizado}
        '401': {description: Não autenticado}
    delete:
      tags: [Posts]
      summary: Deleta um post
      parameters:
        - name: post
          in: path
          required: true
          schema: {type: integer}
      responses:
        '204': {description: Removido}
        '401': {description: Não autenticado}

  # ------------- COMMENTS -------------
  /posts/{post}/comments:
    get:
      tags: [Comments]
      summary: Lista os comentários de um post
      security: []
      parameters:
        - name: post
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: OK}
    post:
      tags: [Comments]
      summary: Adiciona um comentário a um post
      parameters:
        - name: post
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertComment'
      responses:
        '201': {description: Criado}
        '401': {description: Não autenticado}

  /comments/{comment}:
    put:
      tags: [Comments]
      summary: Atualiza um comentário
      parameters:
        - name: comment
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertComment'
      responses:
        '200': {description: Atualizado}
        '401': {description: Não autenticado}
    delete:
      tags: [Comments]
      summary: Deleta um comentário
      parameters:
        - name: comment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '204': {description: Removido}
        '401': {description: Não autenticado}
